spring:
  application:
    name: setpik-server
  config:
    # Docker Compose와 Spring Boot가 프로젝트 루트의 동일한 .env 값을 사용한다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:setpik}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:setpik}
    password: ${DB_PASSWORD:setpik}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
      # Linux MySQL에서도 ERD/Flyway에 적힌 테이블 대소문자를 그대로 사용한다.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spotify:
  oauth:
    authorization-uri: https://accounts.spotify.com/authorize
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/v1/auth/spotify/callback}
    scopes:
      - user-read-email
      - user-read-private
      - playlist-read-private
      - playlist-read-collaborative
      - playlist-modify-private
      - playlist-modify-public
    state-cookie-name: setpik_spotify_oauth_state
    state-cookie-max-age: 10m
    secure-cookie: ${SPOTIFY_COOKIE_SECURE:false}

setpik:
  auth:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:14d}
    refresh-cookie-name: refreshToken
    refresh-cookie-path: /api/v1/auth
    secure-cookie: ${AUTH_COOKIE_SECURE:false}
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/success}
    failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:3000/oauth/failure}
