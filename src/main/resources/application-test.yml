spring:
  datasource:
    url: jdbc:h2:mem:setpik;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  main:
    banner-mode: off

logging:
  level:
    root: WARN
