spring:
  datasource:
    url: jdbc:h2:mem:setpik;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  main:
    banner-mode: off

logging:
  level:
    root: WARN

spotify:
  oauth:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/spotify/callback

setpik:
  auth:
    token-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    success-redirect-uri: http://localhost:3000/oauth/success
    failure-redirect-uri: http://localhost:3000/oauth/failure
