services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: setpik-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-setpik}
      MYSQL_USER: ${DB_USERNAME:-setpik}
      MYSQL_PASSWORD: ${DB_PASSWORD:-setpik}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-setpik} -p${DB_PASSWORD:-setpik} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: setpik-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:8080"

volumes:
  mysql-data:
