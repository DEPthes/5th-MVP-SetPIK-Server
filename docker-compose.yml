services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: setpik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-setpik}
      POSTGRES_USER: ${DB_USERNAME:-setpik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-setpik}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-setpik} -d ${DB_NAME:-setpik}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: setpik-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  postgres-data:
