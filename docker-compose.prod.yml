services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: setpik-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - setpik-network

  app:
    image: ${APP_IMAGE:-setpik-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setpik-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -Duser.timezone=Asia/Seoul
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - setpik-network

volumes:
  mysql-data:
    name: setpik-mysql-data

networks:
  setpik-network:
    name: setpik-network

